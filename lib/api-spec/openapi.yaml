        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /entitlement/premium/sync:
    post:
      operationId: syncPremiumEntitlement
      tags: [users]
      summary: Re-check premium entitlement and propagate to any active room participants
      description: |
        Re-validates premium status against RevenueCat, updates the user record,
        and updates any active participant rows for the caller. The server emits
        a room_updated socket event for every affected room so the chooser's UI
        refreshes the badge without a rejoin.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Entitlement synced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PremiumSyncResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /entitlement/premium:
    get:
      operationId: getPremiumEntitlement
      tags: [users]
      summary: Get current premium entitlement status
      description: |
        Re-validates premium status against RevenueCat and returns
        the caller's current entitlement status.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Entitlement status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PremiumEntitlementResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /identity/start:
    post:
      operationId: startIdentityVerification
      tags: [users]
      summary: Start Stripe Identity age verification
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Verification session started or already verified
          content:
