        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /users/{id}/report:
    post:
      operationId: reportUser
      tags: [users]
      summary: Report a user
      security:
