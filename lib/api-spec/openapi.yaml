      tags: [users]
      summary: Create stripe billing portal session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Billing portal URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeUrlResponse"
        "400":
