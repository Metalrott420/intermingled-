    delete:
      operationId: unlikeUser
      tags: [users]
      summary: Remove a like from a user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Like removed
          content:
            application/json:
              schema:
