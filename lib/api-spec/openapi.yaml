          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/questions:
    get:
      operationId: getAdminQuestions
      tags: [admin]
      summary: List questions with filtering and pagination
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: search
          in: query
          schema:
            type: string
        - name: packSlug
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/QuestionCategory"
        - name: difficulty
          in: query
          schema:
            $ref: "#/components/schemas/QuestionDifficulty"
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Paginated questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuestionListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createAdminQuestion
      tags: [admin]
      summary: Create a new question in the bank
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminQuestionInput"
      responses:
        "201":
          description: Created question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionBankItem"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Duplicate question content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/questions/{id}:
    patch:
      operationId: updateAdminQuestion
      tags: [admin]
      summary: Update question content or metadata
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminQuestionInput"
      responses:
        "200":
          description: Updated question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionBankItem"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Question not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Duplicate question content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/questions/{id}/archive:
    post:
      operationId: archiveAdminQuestion
      tags: [admin]
      summary: Archive a question from active selection
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Archived question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionBankItem"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Question not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    UserProfile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [chooser, suitor]
        status:
          type: string
          enum: [looking, matched, in_room]
        createdAt:
          type: string
        cooldown:
          type: boolean
          description: "True when this Clerk user has hit their daily chooser session limit"
        cooldownEndsAt:
          type: ["string", "null"]
          description: "ISO timestamp when the daily cooldown resets (midnight UTC)"
        sessionsToday:
          type: integer
          description: "Number of chooser sessions used today"
        chooserDailyLimit:
          type: integer
          description: "Maximum chooser sessions allowed per day"
      required:
        - id
        - name
        - role
        - status
        - createdAt

    CreateUserInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        role:
          type: string
          enum: [chooser, suitor]
        personalityVector:
          type: array
          items:
            type: number
          minItems: 7
          maxItems: 7
      required:
        - name
        - role
        - personalityVector

    UpdateUserStatusInput:
      type: object
      properties:
        status:
          type: string
          enum: [looking, matched, in_room]
      required:
        - status

    MatchInput:
      type: object
      properties:
        chooserUserId:
          type: string
        maxSuitors:
          type: integer
          minimum: 3
          maximum: 6
          description: "Optional number of suitors for this auto-match session."
        numberOfRounds:
          type: integer
          description: "Optional: choose 3 or 5 rounds for the session. Defaults to 3."
        questionConfig:
          $ref: "#/components/schemas/RoomQuestionConfig"
      required:
        - chooserUserId

    MatchResult:
      allOf:
        - $ref: "#/components/schemas/Room"
        - type: object
          properties:
            chooserParticipantId:
              type: string
          required:
            - chooserParticipantId

    NotEnoughSuitors:
      type: object
      properties:
        error:
          type: string
        count:
          type: integer
      required:
        - error
        - count

    Participant:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [chooser, suitor]
        suitorSlot:
          type: ["integer", "null"]
        isBot:
          type: boolean
          description: "True when this participant slot is an AI bot contestant"
        isPremium:
          type: boolean
          description: "True when this participant holds an active premium subscription (server-validated)"
      required:
        - id
        - name
        - role
        - suitorSlot
        - isBot
        - isPremium

    Room:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        status:
          type: string
          enum: [waiting, active, ended]
        roomSnapshotVersion:
          type: integer
          description: "Monotonically increasing revision for canonical room snapshots."
        chooserName:
          type: ["string", "null"]
        suitorCount:
          type: integer
        maxSuitors:
          type: integer
        numberOfRounds:
          type: integer
          description: "Number of rounds for this session (defaults to 3 if absent)."
        roundDurationSeconds:
          type: integer
          description: "Per-round duration in seconds for chooser/question phase."
        answerTimeSeconds:
          type: integer
          description: "Answer time in seconds for suitor responses."
        roundEndsAt:
          type: ["string", "null"]
          description: "ISO timestamp when the current round ends (server authoritative)."
        currentRound:
          type: integer
          description: "Current round (1-4). Rounds 1-3: 1 question/suitor then eliminate. Round 4: 3 questions/suitor then choose winner."
        eliminatedParticipants:
          type: array
          items:
            type: string
          description: "Array of participant IDs who have been eliminated"
        winnerId:
          type: ["string", "null"]
        winnerName:
          type: ["string", "null"]
        participants:
          type: array
          items:
            $ref: "#/components/schemas/Participant"
        questionConfig:
          $ref: "#/components/schemas/RoomQuestionConfig"
        currentRoundQuestions:
          type: array
          items:
            $ref: "#/components/schemas/RoomRoundQuestion"
        createdAt:
          type: string
      required:
        - id
        - code
        - status
        - roomSnapshotVersion
        - chooserName
        - suitorCount
        - maxSuitors
        - currentRound
        - eliminatedParticipants
        - winnerId
        - winnerName
        - participants
        - questionConfig
        - currentRoundQuestions
        - createdAt

    Message:
      type: object
      properties:
        id:
          type: string
        roomId:
          type: string
        senderId:
          type: string
        senderName:
          type: string
        senderRole:
          type: string
          enum: [chooser, suitor]
        suitorSlot:
          type: ["integer", "null"]
        round:
          type: ["integer", "null"]
          description: "Which speed-dating round this message belongs to"
        content:
          type: string
        createdAt:
          type: string
      required:
        - id
        - roomId
        - senderId
        - senderName
        - senderRole
        - suitorSlot
        - round
        - content
        - createdAt

    RoomInput:
      type: object
      properties:
        chooserName:
          type: string
          minLength: 1
        maxSuitors:
          type: integer
          minimum: 3
          maximum: 6
          description: "Optional number of suitors for this session. The game length will be maxSuitors - 1 rounds."
        numberOfRounds:
          type: integer
          description: "Optional: choose 3 or 5 rounds for the session. Defaults to 3."
        questionConfig:
          $ref: "#/components/schemas/RoomQuestionConfig"
      required:
        - chooserName

    QuestionCategory:
      type: string
      enum: [general, fun, deep]

    QuestionDifficulty:
      type: string
      enum: [easy, medium, hard]

    RoundDifficulty:
      type: string
      enum: [easy, medium, hard, wildcard]

    QuestionPackStrategy:
      oneOf:
        - type: object
          properties:
            mode:
              type: string
              enum: [single]
            packSlug:
              type: string
              minLength: 1
          required: [mode, packSlug]
        - type: object
          properties:
            mode:
              type: string
              enum: [multi]
            packSlugs:
              type: array
              minItems: 1
              items:
                type: string
                minLength: 1
          required: [mode, packSlugs]
        - type: object
          properties:
            mode:
              type: string
              enum: [weighted]
            packWeights:
              type: object
              additionalProperties:
                type: number
                minimum: 0
          required: [mode, packWeights]
        - type: object
          properties:
            mode:
              type: string
              enum: [seasonal]
            seasonalPackSlugs:
              type: array
              minItems: 1
              items:
                type: string
                minLength: 1
            fallbackPackSlugs:
              type: array
              items:
                type: string
                minLength: 1
          required: [mode, seasonalPackSlugs]
        - type: object
          properties:
            mode:
              type: string
              enum: [premium]
            premiumPackSlugs:
              type: array
              minItems: 1
              items:
                type: string
                minLength: 1
            fallbackPackSlugs:
              type: array
              minItems: 1
              items:
                type: string
                minLength: 1
          required: [mode, premiumPackSlugs, fallbackPackSlugs]

    RoomQuestionConfig:
      type: object
      properties:
        packStrategy:
          $ref: "#/components/schemas/QuestionPackStrategy"
        categoryWeights:
          type: object
          properties:
            general:
              type: number
              minimum: 0
            fun:
              type: number
              minimum: 0
            deep:
              type: number
              minimum: 0
        difficultyPlan:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RoundDifficulty"
        avoidRecentGames:
          type: integer
          minimum: 0
          maximum: 20
        disallowRepeatsInGame:
          type: boolean

    RoomRoundQuestion:
      type: object
      required: [id, content, packSlug, category, difficulty, ratingSummary]
      properties:
        id:
          type: string
        content:
          type: string
        packSlug:
          type: string
        category:
          $ref: "#/components/schemas/QuestionCategory"
        difficulty:
          $ref: "#/components/schemas/QuestionDifficulty"
        ratingSummary:
          $ref: "#/components/schemas/QuestionRatingSummary"

    QuestionRatingSummary:
      type: object
      required: [questionId, ratingCount, averageRating, qualityScore]
      properties:
        questionId:
          type: string
        ratingCount:
          type: integer
        averageRating:
          type: ["number", "null"]
        qualityScore:
          type: ["number", "null"]

    QuestionBankItem:
      type: object
      required: [id, content, packSlug, category, difficulty, normalizedHash, isActive, createdAt, updatedAt]
      properties:
        id:
          type: string
        content:
          type: string
        packSlug:
          type: string
        category:
          $ref: "#/components/schemas/QuestionCategory"
        difficulty:
          $ref: "#/components/schemas/QuestionDifficulty"
        normalizedHash:
          type: string
        isActive:
          type: boolean
        createdByUserId:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    QuestionPackSummary:
      type: object
      required: [packSlug, total, active]
      properties:
        packSlug:
          type: string
        total:
          type: integer
        active:
          type: integer

    QuestionPerformanceSnapshot:
      type: object
      required:
        - questionId
        - content
        - packSlug
        - category
        - difficulty
        - usageCount
        - exposureCount
        - recentExposureCount
        - ratingCount
        - completedCount
        - skippedCount
        - timeoutCount
        - confidenceScore
        - freshnessScore
        - qualityScore
        - suggestedArchive
        - suggestedPromote
      properties:
        questionId:
          type: string
        content:
          type: string
        packSlug:
          type: string
        category:
          $ref: "#/components/schemas/QuestionCategory"
        difficulty:
          $ref: "#/components/schemas/QuestionDifficulty"
        usageCount:
          type: integer
        exposureCount:
          type: integer
        recentExposureCount:
          type: integer
        ratingCount:
          type: integer
        averageRating:
          type: ["number", "null"]
        completedCount:
          type: integer
        completionRate:
          type: ["number", "null"]
        skippedCount:
          type: integer
        skipRate:
          type: ["number", "null"]
        timeoutCount:
          type: integer
        timeoutRate:
          type: ["number", "null"]
        averageResponseTimeSeconds:
          type: ["number", "null"]
        confidenceScore:
          type: integer
        freshnessScore:
          type: integer
        qualityScore:
          type: integer
        suggestedArchive:
          type: boolean
        suggestedPromote:
          type: boolean

    QuestionGroupPerformanceSnapshot:
      type: object
      required:
        - groupValue
        - questionCount
        - exposureCount
        - ratingCount
        - suggestedArchiveCount
        - suggestedPromoteCount
      properties:
        groupValue:
          type: string
        questionCount:
          type: integer
        exposureCount:
          type: integer
        ratingCount:
          type: integer
        averageRating:
          type: ["number", "null"]
        averageQualityScore:
          type: ["number", "null"]
        completionRate:
          type: ["number", "null"]
        skipRate:
          type: ["number", "null"]
        timeoutRate:
          type: ["number", "null"]
        averageResponseTimeSeconds:
          type: ["number", "null"]
        suggestedArchiveCount:
          type: integer
        suggestedPromoteCount:
          type: integer

    QuestionTrendPoint:
      type: object
      required: [bucket, exposureCount, ratingCount]
      properties:
        bucket:
          type: string
        exposureCount:
          type: integer
        ratingCount:
          type: integer
        averageRating:
          type: ["number", "null"]
        averageResponseTimeSeconds:
          type: ["number", "null"]

    QuestionIntelligenceDashboard:
      type: object
      required:
        - leaderboard
        - lowestPerforming
        - packRankings
        - categoryRankings
        - difficultyRankings
        - ratingTrends
        - responseTimeTrends
        - exposureMetrics
      properties:
        leaderboard:
          type: array
          items:
            $ref: "#/components/schemas/QuestionPerformanceSnapshot"
        lowestPerforming:
          type: array
          items:
            $ref: "#/components/schemas/QuestionPerformanceSnapshot"
        packRankings:
          type: array
          items:
            $ref: "#/components/schemas/QuestionGroupPerformanceSnapshot"
        categoryRankings:
          type: array
          items:
            $ref: "#/components/schemas/QuestionGroupPerformanceSnapshot"
        difficultyRankings:
          type: array
          items:
            $ref: "#/components/schemas/QuestionGroupPerformanceSnapshot"
        ratingTrends:
          type: array
          items:
            $ref: "#/components/schemas/QuestionTrendPoint"
        responseTimeTrends:
          type: array
          items:
            $ref: "#/components/schemas/QuestionTrendPoint"
        exposureMetrics:
          type: object
          required:
            - activeQuestions
            - totalExposureCount
            - recentExposureCount
            - averageExposurePerQuestion
            - recentWindowDays
          properties:
            activeQuestions:
              type: integer
            totalExposureCount:
              type: integer
            recentExposureCount:
              type: integer
            averageExposurePerQuestion:
              type: number
            recentWindowDays:
              type: integer

    GuardianOverview:
      type: object
      required:
        - totalReports
        - totalBlocks
        - bannedUsers
        - recentReportCount
        - recentBlockCount
      properties:
        totalReports:
          type: integer
        totalBlocks:
          type: integer
        bannedUsers:
          type: integer
        recentReportCount:
          type: integer
        recentBlockCount:
          type: integer

    GuardianReportItem:
      type: object
      required:
        - id
        - reporterId
        - reporterName
        - reportedId
        - reportedName
        - reportedIsBanned
        - reason
        - createdAt
      properties:
        id:
          type: string
        reporterId:
          type: string
        reporterName:
          type: string
        reportedId:
          type: string
        reportedName:
          type: string
        reportedIsBanned:
          type: boolean
        reason:
          type: string
        detail:
          type: ["string", "null"]
        createdAt:
          type: string

    GuardianBlockItem:
      type: object
      required:
        - blockerId
        - blockerName
        - blockedId
        - blockedName
        - createdAt
      properties:
        blockerId:
          type: string
        blockerName:
          type: string
        blockedId:
          type: string
        blockedName:
          type: string
        createdAt:
          type: string

    GuardianTopReportedUser:
      type: object
      required:
        - userId
        - userName
        - reportCount
        - isBanned
      properties:
        userId:
          type: string
        userName:
          type: string
        reportCount:
          type: integer
        isBanned:
          type: boolean

    GuardianDashboard:
      type: object
      required:
        - overview
        - recentReports
        - recentBlocks
        - topReportedUsers
      properties:
        overview:
          $ref: "#/components/schemas/GuardianOverview"
        recentReports:
          type: array
          items:
            $ref: "#/components/schemas/GuardianReportItem"
        recentBlocks:
          type: array
          items:
            $ref: "#/components/schemas/GuardianBlockItem"
        topReportedUsers:
          type: array
          items:
            $ref: "#/components/schemas/GuardianTopReportedUser"

    BallroomEventStatus:
      type: string
      enum: [scheduled, live, completed, cancelled]

    BallroomEvent:
      type: object
      required:
        - id
        - title
        - status
        - startsAt
        - endsAt
        - isFeatured
        - metadata
        - createdByUserId
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/BallroomEventStatus"
        startsAt:
          type: string
        endsAt:
          type: ["string", "null"]
        isFeatured:
          type: boolean
        metadata:
          type: object
          additionalProperties: true
        createdByUserId:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    CreateBallroomEventInput:
      type: object
      required: [title, startsAt]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/BallroomEventStatus"
        isFeatured:
          type: boolean
        metadata:
          type: object
          additionalProperties: true

    UpdateBallroomEventInput:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/BallroomEventStatus"
        isFeatured:
          type: boolean
        metadata:
          type: object
          additionalProperties: true

    NotifyBallroomEventInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        body:
          type: string
          minLength: 1
          maxLength: 240
        dryRun:
          type: boolean

    BallroomEventNotifyResult:
      type: object
      required: [ok, notifiedCount, dryRun]
      properties:
        ok:
          type: boolean
        notifiedCount:
          type: integer
        dryRun:
          type: boolean

    RateRoomQuestionInput:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        participantId:
          type: string
          description: Optional participant id used to tie ratings to a live room seat.

    QuestionRatingResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    CreateAdminQuestionInput:
      type: object
      properties:
        content:
          type: string
          minLength: 1
        packSlug:
          type: string
          minLength: 1
          maxLength: 64
        category:
          $ref: "#/components/schemas/QuestionCategory"
        difficulty:
          $ref: "#/components/schemas/QuestionDifficulty"
      required: [content, packSlug, category, difficulty]

    UpdateAdminQuestionInput:
      type: object
      minProperties: 1
      properties:
        content:
          type: string
          minLength: 1
        packSlug:
          type: string
          minLength: 1
          maxLength: 64
        category:
          $ref: "#/components/schemas/QuestionCategory"
        difficulty:
          $ref: "#/components/schemas/QuestionDifficulty"
        isActive:
          type: boolean

    AdminPagination:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    AdminQuestionListResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuestionBankItem"
        pagination:
          $ref: "#/components/schemas/AdminPagination"

    JoinInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        role:
          type: string
          enum: [chooser, suitor]
      required:
        - name
        - role

    JoinResult:
      type: object
      properties:
        participantId:
