name: Ship Readiness Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/**'
      - 'lib/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'tsconfig.base.json'
      - '.github/workflows/ship-gate.yml'
  push:
    branches: [main]
    paths:
      - 'artifacts/**'
      - 'lib/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'tsconfig.base.json'
      - '.github/workflows/ship-gate.yml'

jobs:
  ship-gate:
    name: Ship Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ship readiness gate
        run: pnpm run ship:ready
