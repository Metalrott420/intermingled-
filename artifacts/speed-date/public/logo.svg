<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Silver Metallic Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="40%" stop-color="#cbd5e1" />
      <stop offset="80%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#eab308" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Dark Background Canvas -->
  <rect width="500" height="400" rx="24" fill="#08080c" />

  <!-- Interlocking Puzzle Heart Group -->
  <g filter="url(#goldGlow)" transform="translate(60, 30)">
    <!-- Gold Left Puzzle Piece -->
    <path d="M 40 50
             H 130
             C 130 30, 160 30, 160 50
             H 190
             V 110
             C 210 110, 210 140, 190 140
             V 220
             H 40
             V 140
             C 20 140, 20 110, 40 110
             Z"
          fill="url(#goldGrad)"
          stroke="#fef08a"
          stroke-width="1.5" />

    <!-- Silver Right Puzzle Piece -->
    <path d="M 190 50
             H 340
             V 110
             C 360 110, 360 140, 340 140
             V 220
             H 250
             C 250 240, 220 240, 220 220
             H 190
             V 140
             C 210 140, 210 110, 190 110
             Z"
          fill="url(#silverGrad)"
          stroke="#f8fafc"
          stroke-width="1.5" />

    <!-- Heart Negative Space Cutout in Center -->
    <path d="M 190 135
             C 175 110, 140 110, 140 135
             C 140 160, 190 185, 190 185
             C 190 185, 240 160, 240 135
             C 240 110, 205 110, 190 135 Z"
          fill="#08080c" />
  </g>

  <!-- Metallic Gold Text INTERMINGLED -->
  <text x="250" y="320"
        text-anchor="middle"
        fill="url(#goldGrad)"
        font-family="Barlow, Inter, sans-serif"
        font-size="28"
        font-weight="900"
        letter-spacing="12">
    INTERMINGLED
  </text>

  <!-- Gold Heart Line Flourish -->
  <line x1="120" y1="340" x2="220" y2="340" stroke="url(#goldGrad)" stroke-width="1.5" />
  <path d="M 250 336 C 246 331, 240 331, 240 336 C 240 341, 250 346, 250 346 C 250 346, 260 341, 260 336 C 260 331, 254 331, 250 336 Z" fill="url(#goldGrad)" />
  <line x1="280" y1="340" x2="380" y2="340" stroke="url(#goldGrad)" stroke-width="1.5" />
</svg>
